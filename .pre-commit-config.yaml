# MEDS-S1 -- pre-commit hooks
# Run `pip install pre-commit && pre-commit install` once per clone to enable.

exclude: '^(docs/figures/|PROJECTS\.md$)'

repos:
  # Official, well-tested hooks for the two common whitespace issues.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        stages: [pre-commit]

      - id: trailing-whitespace
        stages: [pre-commit]

      - id: check-merge-conflict

      - id: check-added-large-files
        args: [--maxkb=500]

      - id: detect-private-key

      - id: check-yaml

      - id: check-case-conflict

      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit]

  # Tabs -> 4 spaces. No standard hook for this (it's convention-specific),
  # so it's a small local hook using the POSIX `expand` utility.
  - repo: local
    hooks:
      - id: tabs-to-spaces
        name: convert tabs to 2 spaces
        entry: bash -c 'for f in "$@"; do expand -t 2 "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done' --
        language: system
        files: '\.(py|sv|svh)$'
        stages: [pre-commit]
