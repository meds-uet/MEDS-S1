or="start" opacity="1.0" style="">x_norollback = &quot;I can no longer fault, retire me&quot;.  Only it gates retire, so a 300-cycle op retires in two cycles and keeps running.</text><rect x="28.0" y="96.0" width="190.0" height="122.0" rx="4" fill="#eaf0f9" stroke="#3b5b8c" stroke-width="1.2" opacity="1.0"/><text x="40.0" y="116.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9.4" font-weight="bold" fill="#16314f" text-anchor="start" opacity="1.0" style="">WHY A PROFILE?</text><text x="40.0" y="134.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.2" font-weight="normal" fill="#16314f" text-anchor="start" opacity="1.0" style="">MEDS-V&#x27;s published</text><text x="40.0" y="145.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.2" font-weight="normal" fill="#16314f" text-anchor="start" opacity="1.0" style="">interface has no commit/</text><text x="40.0" y="156.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.2" font-weight="normal" fill="#16314f" text-anchor="start" opacity="1.0" style="">kill channel.  Profiling</text><text x="40.0" y="167.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.2" font-weight="normal" fill="#16314f" text-anchor="start" opacity="1.0" style="">CV-X-IF keeps standard</text><text x="40.0" y="179.3" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.2" font-weight="normal" fill="#16314f" text-anchor="start" opacity="1.0" style="">names and the upgrade path</text><text x="40.0" y="190.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.2" font-weight="normal" fill="#16314f" text-anchor="start" opacity="1.0" style="">while making the existing</text><text x="40.0" y="201.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.2" font-weight="normal" fill="#16314f" text-anchor="start" opacity="1.0" style="">MEDS-V design legal.</text></svg>