vetica, Arial, sans-serif" font-size="8.8" font-weight="normal" fill="#6d211a" text-anchor="start" opacity="1.0" style="">A PTW with an unused second port costs an arbiter.  A PTW without one costs an MMU rewrite during Linux bring-up, when MEDS-V&#x27;s vector loads suddenly need translated addresses.</text></svg>