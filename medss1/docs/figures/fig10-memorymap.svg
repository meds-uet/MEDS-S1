 font-weight="normal" fill="#1a1a1a" text-anchor="start" opacity="1.0" style="">cacheable · idempotent · ordering · atomicity · alignment · widths</text><text x="54.0" y="616.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.4" font-weight="normal" fill="#1a1a1a" text-anchor="start" opacity="1.0" style=""></text><text x="54.0" y="628.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.4" font-weight="normal" fill="#1a1a1a" text-anchor="start" opacity="1.0" style="">P1  a non-idempotent region is never speculated, prefetched or replayed</text><text x="54.0" y="640.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.4" font-weight="normal" fill="#1a1a1a" text-anchor="start" opacity="1.0" style="">P2  order:strong regions are accessed in program order without a fence</text><text x="54.0" y="652.7" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.4" font-weight="normal" fill="#1a1a1a" text-anchor="start" opacity="1.0" style="">P3  an alignment or width violation faults, never truncates silently</text></svg>