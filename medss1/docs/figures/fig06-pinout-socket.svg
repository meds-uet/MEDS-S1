ght="bold" fill="#16314f" text-anchor="start" opacity="1.0" style="">CDC LIVES IN THE SOCKET, NOT IN THE ACCELERATOR</text><text x="56.0" y="554.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.6" font-weight="normal" fill="#16314f" text-anchor="start" opacity="1.0" style="">With ASYNC=1 the socket instantiates AXI clock-domain-crossing bridges. An accelerator author sets a parameter, supplies a clock,</text><text x="56.0" y="570.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.6" font-weight="normal" fill="#16314f" text-anchor="start" opacity="1.0" style="">and writes purely synchronous logic. Per NFR-6 they may not write synchroniser logic at all.</text></svg>