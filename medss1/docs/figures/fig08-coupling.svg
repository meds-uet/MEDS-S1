<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="amb5711f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#b5711f"/></marker><marker id="as555555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#555555"/></marker></defs><text x="540.0" y="26.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle" opacity="1.0" style="">The two attachment mechanisms</text><text x="540.0" y="44.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#6b6b6b" text-anchor="middle" opacity="1.0" style="font-style:italic;">tightly-coupled units are given instructions; loosely-coupled units are given work</text><rect x="36.0" y="76.0" width="480.0" height="380.0" rx="6" fill="#eaf0f9" stroke="#3b5b8c" stroke-width="1.1" stroke-dasharray="5 3" opacity="1.0"/><text x="46.0" y="91.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#16314f" text-anchor="start" opacity="1.0" style="">TIGHT — MXIF   (SPEC §19)</text><rect x="70.0" y="116.0" width="180.0" height="54.0" rx="4" fill="#eaf0f9" stroke="#3b5b8c" stroke-width="1.3" opacity="1.0"/><text x="160.0" y="140.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#16314f" text-anchor="middle" opacity="1.0" style="">S1-Core</text><text x="160.0" y="154.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#16314f" text-anchor="middle" opacity="0.85" style="">pipeline + CB</text><rect x="300.0" y="116.0" width="180.0" height="54.0" rx="4" fill="#fdf2e2" stroke="#b5711f" stroke-width="1.3" opacity="1.0"/><text x="39