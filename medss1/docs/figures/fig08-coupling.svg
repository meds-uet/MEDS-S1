t><text x="70.0" y="328.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="normal" fill="#16314f" text-anchor="start" opacity="1.0" style="">•  ~2–5 cycle invocation overhead</text><text x="70.0" y="348.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="normal" fill="#16314f" text-anchor="start" opacity="1.0" style="">•  good for 1–100 cycles of work</text><text x="70.0" y="368.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="normal" fill="#16314f" text-anchor="start" opacity="1.0" style="">•  needs the 7-item toolchain checklist</text><rect x="62.0" y="396.0" width="424.0" height="42.0" rx="3" fill="#eaf0f9" stroke="#3b5b8c" stroke-width="1.0" opacity="1.0"/><text x="274.0" y="414.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="bold" fill="#16314f" text-anchor="middle" opacity="1.0" style="">MEDS-V · crypto rounds · activations · posit ALU</text><text x="274.0" y="430.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8" font-weight="normal" fill="#6b6b6b" text-anchor="middle" opacity="1.0" style="font-style:italic;">examples</text><rect x="564.0" y="76.0" width="480.0" height="380.0" rx="6" fill="#fdf2e2" stroke="#b5711f" stroke-width="1.1" stroke-dasharray="5 3" opacity="1.0"/><text x="574.0" y="91.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#6d4310" text-anchor="start" opacity="1.0" style="">LOOSE — accelerator socket   (SPEC §20)</text><rect x="598.0" y="116.0" width="180.0" height="54.0" rx="4" fill="#eaf0f9" stroke="#3b5b8c" stroke-width="1.3" opacity="1.0"/><text x="688.0" y="140.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#16314f" text-anchor="middle" opacity="1.0" style="">S1-Core</text><text x="688.0" y="154.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size=