d by an MMIO write</text><text x="598.0" y="308.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="normal" fill="#6d4310" text-anchor="start" opacity="1.0" style="">•  operands from memory via DMA</text><text x="598.0" y="328.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="normal" fill="#6d4310" text-anchor="start" opacity="1.0" style="">•  ~50–200 cycle invocation overhead</text><text x="598.0" y="348.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="normal" fill="#6d4310" text-anchor="start" opacity="1.0" style="">•  good for 1000+ cycles of work</text><text x="598.0" y="368.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="normal" fill="#6d4310" text-anchor="start" opacity="1.0" style="">•  no toolchain work — it is just a driver</text><rect x="590.0" y="396.0" width="424.0" height="42.0" rx="3" fill="#fdf2e2" stroke="#b5711f" stroke-width="1.0" opacity="1.0"/><text x="802.0" y="414.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="bold" fill="#6d4310" text-anchor="middle" opacity="1.0" style="">conv engines · systolic arrays · FFT · DL accelerators</text><text x="802.0" y="430.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8" font-weight="normal" fill="#6b6b6b" text-anchor="middle" opacity="1.0" style="font-style:italic;">recommended for most DL/ML theses</text><text x="540.0" y="486.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9.4" font-weight="bold" fill="#b03a2e" text-anchor="middle" opacity="1.0" style="">The common mistake: attaching a convolution engine over MXIF because instructions feel elegant.</text><text x="540.0" y="502.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9" font-weight="normal" fill="#6b6b6b" text-anchor="middle" opacity="1.0" style="">A convolution runs for thousands of cycles and streams megabytes. It does not want to be an instruction.</text></svg>