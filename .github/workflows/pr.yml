#
# The merge gate.  Budget: under 20 minutes (NFR-3).
#
# GROWTH PLAN -- jobs are added here as their owning project lands.  A job that
# is not ready is present and SKIPPED rather than absent, so enabling it is a
# one-line change instead of a new pipeline:
#
#   archtest  (ACT4 with Sail)        enable in M-11 / T-07  -> drop `if: false`
#   cosim     (Spike over RVFI)       enable in R-05         -> drop `if: false`
#   bench     (CoreMark, Embench)     enable in M-07 / M-08  -> drop `if: false`
#
# Until the self-hosted runner is racked (EXECUTION_PLAN R7) these run on
# GitHub-hosted runners.  Swap `runs-on` to [self-hosted, meds-ci] then.

name: PR

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERILATOR_VERSION: "5.020"

jobs:
  # ---------------------------------------------------------------- always on
  structure:
    name: structure conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - name: check repository conventions
        run: python3 scripts/check_structure.py

  docs:
    name: documentation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: every RTL module has a docs/modules page
        run: python3 scripts/check_docs.py

  lint:
    name: lint + elaborate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [s1_nano, s1_base, s1_ai, s1_linux]
    steps:
      - uses: actions/checkout@v4
      - name: install verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: lint ${{ matrix.config }}
        run: make lint CONFIG=${{ matrix.config }}

  unit:
    name: unit testbenches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: install verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: run unit tests
        run: make test-unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-logs
          path: build/unit/**/*.log
          if-no-files-found: ignore

  # ------------------------------------------------ growth slots (see header)
  archtest:
    name: ACT / RISCOF vs Sail
    # ENABLE IN M-11 / T-07: delete the next line once verif/riscof/ has a
    # working DUT plugin.  See docs/guidelines/VERIFICATION_GUIDE.md section 6.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install riscof
      - name: run the architectural test suite
        run: make riscof CONFIG=s1_base
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: riscof-report, path: verif/riscof/report/}

  cosim:
    name: Spike co-simulation over RVFI
    # ENABLE IN R-05: delete once verif/cosim/ has a working comparator.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compare every retired instruction against Spike
        run: make cosim CONFIG=s1_base

  bench:
    name: benchmarks + regression gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore RISC-V toolchain cache
        id: riscv-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.riscv
          key: riscv-m07-bench-ubuntu-latest-toolchain-bca3efed29eaeb1000bd96e9af9d3bc77ff644b4-spike-8fc5ab0357a7cc9a19f79c93b0370103cfe3ce84-rv64imac-lp64

      - name: Add RISC-V tools to PATH
        run: echo "${{ github.workspace }}/.riscv/bin" >> "$GITHUB_PATH"

      - name: Install RISC-V toolchain build dependencies
        if: steps.riscv-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            autotools-dev \
            curl \
            python3 \
            python3-pip \
            python3-tomli \
            libmpc-dev \
            libmpfr-dev \
            libgmp-dev \
            gawk \
            build-essential \
            bison \
            flex \
            texinfo \
            gperf \
            libtool \
            patchutils \
            bc \
            zlib1g-dev \
            libexpat-dev \
            ninja-build \
            git \
            cmake \
            libglib2.0-dev \
            device-tree-compiler \
            libslirp-dev \
            libzstd-dev \
            libboost-regex-dev \
            libboost-system-dev

      - name: Build pinned RISC-V Newlib toolchain
        if: steps.riscv-cache.outputs.cache-hit != 'true'
        env:
          RISCV: ${{ github.workspace }}/.riscv
        run: |
          git clone https://github.com/riscv-collab/riscv-gnu-toolchain.git "$RUNNER_TEMP/riscv-gnu-toolchain"
          cd "$RUNNER_TEMP/riscv-gnu-toolchain"

          git checkout bca3efed29eaeb1000bd96e9af9d3bc77ff644b4
          git submodule update --init --recursive

          ./configure \
            --prefix="$RISCV" \
            --with-arch=rv64imac \
            --with-abi=lp64 \
            --enable-multilib

          make -j"$(nproc)"

      - name: Build pinned Spike
        if: steps.riscv-cache.outputs.cache-hit != 'true'
        env:
          RISCV: ${{ github.workspace }}/.riscv
        run: |
          cd "$RUNNER_TEMP/riscv-gnu-toolchain/spike"
          git checkout 8fc5ab0357a7cc9a19f79c93b0370103cfe3ce84

          mkdir build
          cd build
          ../configure --prefix="$RISCV"
          make -j"$(nproc)"
          make install

      - name: Verify M-07 tools
        run: |
          command -v riscv64-unknown-elf-gcc
          command -v riscv64-unknown-elf-as
          command -v spike
          riscv64-unknown-elf-gcc --version
          riscv64-unknown-elf-as --version
          riscv64-unknown-elf-gcc -print-multi-lib
          spike --help | head -5

      - run: make bench CONFIG=s1_base

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: |
            build/bench/**
          if-no-files-found: warn
  # ------------------------------------------------------------------ summary
  gate:
    name: merge gate
    runs-on: ubuntu-latest
    needs: [structure, docs, lint, unit, bench]
    if: always()
    steps:
      - name: fail if any required job failed
        run: |
          echo "structure: ${{ needs.structure.result }}"
          echo "docs:      ${{ needs.docs.result }}"
          echo "lint:      ${{ needs.lint.result }}"
          echo "unit:      ${{ needs.unit.result }}"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "::error::merge gate failed -- nothing merges red"
            exit 1
          fi
